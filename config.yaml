# =====================================================================
#  ミームコイン候補スキャナー 設定ファイル
#  ここの数字を書き換えて GitHub に保存(Commit)すると、次の実行から反映されます。
#  「#」から右はメモ(説明)なので、動作には影響しません。
# =====================================================================

# ---------------------------------------------------------------------
# 1. 候補の集め方
# ---------------------------------------------------------------------
sources:
  dexscreener:
    token_profiles: true        # 新しくプロフィール登録された銘柄
    community_takeovers: true   # コミュニティ乗っ取り(CTO)された銘柄
    token_boosts: true          # ブースト(広告)が新しく付いた銘柄
    search_queries: []          # 検索ワードで探す場合に追加 例: ["pepe", "cat"]
    search_max_age_hours: 24    # 検索結果のうち、作成からこの時間以内のペアだけ使う
  trending:                     # Solana Tracker のトレンド一覧(GMGN のトレンド欄に近い)。C基準の主な探し場所
    enabled: true
    path: /tokens/trending/6h   # 期間: 5m 15m 30m 1h 2h 3h 4h 5h 6h 12h 24h
    limit: 100
    every_n_runs: 1             # 毎回(15分おき)取得。無料枠(月10,000回)に収まるよう monthly_budget で上限管理
  graduated:                    # pump.fun を卒業したばかりの銘柄一覧
    enabled: true
    path: /tokens/multi/graduated
    limit: 100
    every_n_runs: 1
  trending_1h:                  # 直近1時間で勢いのある銘柄
    enabled: true 
    label: STトレンド1h
    path: /tokens/trending/1h
    limit: 100
    every_n_runs: 4             # 4 = 1時間に1回
    offset: 1                   # 他の一覧と同じ回に重ならないようにずらす
  trending_24h:                 # 1日を通して注目されている銘柄(数日たった銘柄も拾う)
    enabled: true 
    label: STトレンド24h
    path: /tokens/trending/24h
    limit: 100
    every_n_runs: 4
    offset: 2
  volume_6h:                    # 直近6時間の出来高(売買額)が多い銘柄
    enabled: true 
    label: ST出来高6h
    path: /tokens/volume/6h
    limit: 100
    every_n_runs: 4
    offset: 3
  pumpfun:
    enabled: true               # pump.fun「完成中」(卒業前)の銘柄を早めに見張り対象に入れる。卒業後にC基準で判定(10/6〜)
    min_curve: 50               # 卒業までの進み具合(%)の下限
    max_curve: 95               # 上限
    limit: 100                  # 1回で取得する最大件数(多いほど見送りの記録が増える)
    every_n_runs: 2             # 30分に1回(無料枠の節約)

# ---------------------------------------------------------------------
# 2. 必須条件(1つでも満たさなければ「除外」)
# ---------------------------------------------------------------------
mandatory:
  require_mint_renounced: true      # 追加発行の権限が放棄済み
  require_freeze_renounced: true    # 凍結権限が放棄済み
  reject_dangerous_extensions: true # permanent delegate / transfer hook / 送金不可 / 一時停止
  reject_rugged: true               # RugCheck で rugged 判定
  require_address_suffix: pump      # アドレスの末尾がこの文字なら通過。使わない場合は "" にする
  allowed_launchpads: [Pump.Fun, pump_fun]   # 末尾が違っても、RugCheck の発行元(launchpad)がこれなら通過
                                             # それ以外は除外(7日間は調べ直さない)
  exclude_risk_keywords:            # RugCheck の警告(名前・説明)にこの文字が含まれたら除外
    - {keyword: "creator history", label: "開発者のラグ歴(Creator history of rugged tokens)"}
    - {keyword: "fee config", label: "手数料を変更できる設定(Fee config enabled)"}

# ---------------------------------------------------------------------
# 3. 判定基準(満たさなければ「見送り」)
# ---------------------------------------------------------------------
criteria_a:                         # A:卒業済み銘柄(DEXで取引中)= C基準
  min_age_minutes: 30               # 卒業(DEX上場)から30分以上
  min_liquidity_usd: 30000         # (10/6 夜 $20K→$30K: 流動性が薄いと指値・損切りが大きく滑るため)
  max_bundle_pct: 30
  max_top10_pct: 30                 # AMMプールを除いた上位10件
  min_mcap_usd: 60000               # 時価総額 $60K〜$250K(10/5 変更: $240K超の買いが大きく負け越し)
  max_mcap_usd: 250000
  min_holders: 300
  max_insider_pct: 10               # インサイダー(開発者の仲間と思われるウォレット群)の保有率(10/6夜 5→10%を1週間試験。10/13ごろ成績で判断)
  max_dev_pct: 5                    # 開発者の保有率
  min_avg_trade_usd: 20             # 6時間の出来高÷取引数。小さいと Bot の水増しの疑い
  max_change_h6_pct: 100            # 6時間で+100%を超える急騰中は見送り(押し目待ち)

# 上位10件の計算で、流動性プールの口座を見分ける方法(RugCheck の同じレポート内で照合)
#   ① RugCheck が AMM と判定した口座  ② プール本体・プールのトークン口座  ③ 保有数がプール残高と一致
#   ④ 保有数×価格がプールのトークン側の金額と一致(①〜③で見つからないときの予備)
pool_detection:
  amount_tolerance_pct: 0.5         # ③ 残高一致とみなす誤差
  use_value_match: false            # ④ を使うか(2026-10-04: 一般の保有者をプールと誤判定するため停止)
  value_tolerance_pct: 20           # ④ 金額一致とみなす誤差(RugCheck の価格とプール残高は時点が少しずれるため広め)
  value_min_pool_usd: 1000          # ④ はこの金額以上のプールだけで判定

criteria_b:                         # B:pump.fun 卒業前
  enabled: false                    # C基準では卒業前は対象外。true にすると下の基準で判定
  min_curve_pct: 50
  max_curve_pct: 95
  min_mcap_usd: 15000
  max_mcap_usd: 60000
  min_holders: 100
  max_dev_pct: 5
  max_bundle_pct: 30

# バンドル率などが取得できなかったときの扱い
#   hold  = 見送りにする(安全寄り)
#   allow = 基準を満たしたものとして進める(通知に「不明」と表示)
on_missing_bundle: hold
bundle_metric: current              # current=現在の保有率 / initial=購入時点の保有率

# ---------------------------------------------------------------------
# 4. リスク点数(min〜max に入ったら points を加算。上から順に最初に当てはまったもの)
# ---------------------------------------------------------------------
scoring:
  bundle:
    - {min: 15, max: 30, points: 2}
  top10:
    - {min: 30, max: 40, points: 2}
    - {min: 20, max: 30, points: 1}
  insider:
    small_points: 1                 # インサイダーのウォレット群あり(小規模)
    large_points: 3                 # 大規模
    large_min_wallets: 50           # この数以上なら大規模
    large_min_pct: 5                # または保有率がこの%を超えたら大規模
  copycat:                          # 有名銘柄と同じシンボル(RugCheck の copycat 警告)
    keywords: ["copycat"]
    points: 2
  lp:                               # 卒業済み(A)のみ
    burn_threshold_pct: 90          # 焼却率がこれ以上なら「焼却済み」で 0 点
    lock_only: 1                    # 焼却なしでロックのみ(ロック率90%以上)
    partial_lock: 2                 # ロック率90%未満
    no_lock: 3                      # ロックなし
    unknown: 1                      # LP の状態が分からない(RugCheck に市場情報がない)
    partial_threshold_pct: 90
    # LP トークンがない仕組みのプールは LP 項目の対象外(0点)
    # (LP の発行元が空欄のプールも自動で対象外。pump.fun 卒業前もボンディングカーブのため対象外)
    no_lp_market_types: [meteoraDlmm, meteoraDamm2, dlmm, clmm, whirlpool, orca]
  age_minutes:
    - {min: 30, max: 60, points: 2}
    - {min: 60, max: 360, points: 1}
  pre_graduation: 2                 # pump.fun 卒業前
  liquidity_usd:
    - {min: 15000, max: 30000, points: 1}
  price_move_1h:
    abs_pct: 30                     # 直近1時間で ±30% を超えたら
    points: 2
  volume_to_liquidity:
    ratio: 20                       # 出来高が流動性の20倍以上
    window: h24                     # h24=24時間出来高 / h1=1時間出来高
    points: 2
  ads: 1                            # Dex Boost・tokenAd などの広告を購入
  ad_order_types: [tokenAd, trendingBarAd]   # orders API で広告とみなす種類
  no_socials: 1                     # 公式サイト・SNS がない
  transfer_fee:
    over_pct: 1                     # 売買税・送金手数料がこの%を超えたら
    points: 1

tiers:                              # 合計点での分類
  small_max: 2                      # 0〜2点 → 候補(リスク小)
  medium_max: 5                     # 3〜5点 → 候補(リスク中) / 6点以上 → 候補(リスク大)

# ---------------------------------------------------------------------
# 5. テーマ(銘柄名・シンボル・説明文から自動判定。点数には含めない)
#    英字は大文字小文字を区別しません。
#    「=」で始まる語は単語として一致したときだけ(例: =ai は "Snail" には反応しない)
# ---------------------------------------------------------------------
themes:
  猫: [cat, kitty, kitten, meow, neko, popcat, mew, 猫, ねこ, ネコ]
  犬: [dog, doge, shib, "=inu", puppy, "=pup", corgi, "=wif", bonk, 犬, いぬ, イヌ]
  カエル: [pepe, frog, 蛙, カエル]
  その他の動物: [penguin, pengu, monkey, "=ape", hamster, bear, "=bull", fish, duck, goat, horse, panda, rabbit, bunny, capybara, hippo, 動物]
  AI: ["=ai", "=agi", agent, "=gpt", "=llm", neural, "artificial intelligence", claude, grok, openai, chatbot]
  有名人便乗: [trump, melania, elon, musk, kanye, drake, "=cz", vitalik, saylor, "=mrbeast", "=ceo", taylor swift, obama, biden, putin]
  政治: [maga, president, election, congress, senate, 大統領]
  アニメ・ゲーム: [anime, manga, pokemon, pikachu, "=gta", minecraft, roblox, アニメ]
  食べ物: [pizza, burger, sushi, ramen, banana, cookie, taco, "=egg", 寿司]
  宇宙: [moon, mars, rocket, space, galaxy, alien, "=ufo"]
  お金・定番ミーム: [chad, wojak, "=gm", degen, "=send", "=hodl", diamond]

# ---------------------------------------------------------------------
# 5b. ナラティブ(参考・点数外)。候補を通知するときだけ調べる(すべて無料)
#     ★: 一般ニュース1件以上で+1、5件以上で+2 / 公式XとWebサイトが両方あれば+1(最大3)
#     ニュースは Googleニュース(RSS)で銘柄名を直近24時間検索。仮想通貨系の記事は別に数える
# ---------------------------------------------------------------------
narrative:
  enabled: true
  max_per_run: 10                   # 1回の実行で調べる最大件数
  cache_hours: 3                    # 同じ銘柄を調べ直すまでの時間

# ---------------------------------------------------------------------
# 5c. 🎯 勝ちパターン(急騰→急落→横ばい)の検出。条件を満たしたら別の通知を送る
#     スキャナーの記録(約15分ごと)で判定するので、ローソク足のヒゲは見えません。
#     通知が来たら GMGN の5分足で「発注前チェック」を必ず確認してください
# ---------------------------------------------------------------------
pattern:
  enabled: true
  lookback_hours: 6                 # 高値を探す期間
  drop_from_peak_pct: 40            # 高値からこの%以上下がっている
  range_window_minutes: 35          # 横ばいを判定する直近の時間幅
  min_range_minutes: 15             # 横ばいがこの時間以上続いている(記録2回以上)
  band_pct: 10                      # 横ばいの値幅(中心から±%)
  new_low_tolerance_pct: 3          # 最新の値が、それまでの横ばいの安値をこれ以上割ったら「安値更新」
  max_m5_drop_pct: 15               # 直近5分がこの%以上の下落なら通知しない(大陰線の最中)
  min_liquidity_usd: 30000          # 流動性の下限(発注前チェック①)
  holders_drop_tolerance_pct: 3     # 保有者が高値後の最大からこの%以上減ったら「減少」
  recheck_minutes: 15               # 高値をつけた銘柄は、この間隔で記録を取る(通常は30分)
  renotify_hours: 6                 # 同じ銘柄の🎯通知の間隔
  limit_position: 0.25              # 指値の目安 = 横ばいの下限 + 値幅 × この割合
  sl_below_range_pct: 8             # 損切りの目安 = 横ばいの下限からこの%下
  tp_pct: 40                        # 利確の目安 = 指値から +この%

# ---------------------------------------------------------------------
# 6. 通知
# ---------------------------------------------------------------------
notify:
  renotify_hours: 24                # 同じ銘柄はこの時間内は再通知しない(段階が変わったら再通知)
  daily_summary_hour_jst: 21        # 見送り・成績のまとめを送る時刻(日本時間 0〜23)
  notify_tiers: [小, 中, 大]         # 通知する段階。例: 大を通知しないなら [小, 中]

# ---------------------------------------------------------------------
# 7. 仮想売買(ペーパートレード)。実際の売買は一切しません
#    候補を通知した時点で amount_usd 分を買ったことにして、下のルールで損益を計算
# ---------------------------------------------------------------------
paper_trading:
  enabled: true
  amount_sol: 0.05                 # 1回の仮想購入額(SOL)。実際の取引と同じ金額(10/6 20:22〜 0.05未満には下げない)
  amount_usd: 20                   # SOL 価格が取れないときの予備
  stop_loss_pct: -40               # 購入価格からこの%まで下がったら残りを全部売る
  take_profit:                     # 上から順に判定
    - {pct: 50, sell_ratio: 0.5}   # +50% で最初の数量の半分を売る
    - {pct: 100, sell_ratio: 1.0}  # +100% で残りを全部売る
  time_exit_minutes: 60            # 購入からこの時間がたったら残りを全部売る
  fee_pct: 1.0                     # 1回の売買ごとの手数料・スリッページ(価格のずれ)の見込み。0 にすると無視
  tiers: [小, 中, 大]              # 仮想売買の対象にする段階
  max_entries_per_day:             # 1日(日本時間 0時〜24時)の仮想購入の上限回数
    weekday: 99                    # 月〜金(10/6〜 回数上限なし。損失上限と2連敗で止める)
    weekend: 99                    # 土・日(10/6〜 回数上限なし)
  daily_loss_limit_sol: 99         # (10/6夜〜 損失上限なし・連敗終了なし。発注前チェックで絞る)

# ---------------------------------------------------------------------
# 8. 動作・API 回数の上限
# ---------------------------------------------------------------------
runtime:
  max_runtime_sec: 300              # 1回の実行で使う最大時間(GitHub の無料枠節約)
  rugcheck_max_per_run: 40          # RugCheck を1回で新しく調べる最大件数
  rugcheck_skip_below_liquidity: true  # 流動性が criteria_a の基準未満なら RugCheck を省略して見送り
                                       # (pump.fun 卒業前は対象外。false にすると全銘柄を RugCheck)
  rugcheck_interval_sec: 0.6        # RugCheck への連続アクセスの間隔
  rugcheck_fresh_minutes: 60        # 候補として通知する前に、これより古い RugCheck 結果は取り直す
  st_cache_minutes: 60              # Solana Tracker の結果を使い回す時間(無料枠が厳しいときは 180 など)
  recheck_minutes: 30               # 見送り・候補の銘柄を再チェックする間隔
  excluded_recheck_hours: 6         # 除外銘柄を再チェックするまでの時間
  watch_hours: 24                   # 見つけた銘柄を追いかける時間
  max_watch: 400                    # 追いかける銘柄の上限数

solana_tracker:
  monthly_budget: 9000              # 1か月に使ってよいリクエスト数(無料プランの上限より少し少なめに)
  daily_pacing: true                # 月の上限を日割りして、月初に使い切らないようにする
