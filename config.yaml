# =====================================================================
#  ミームコイン候補スキャナー 設定ファイル
#  ここの数字を書き換えて GitHub に保存(Commit)すると、次の実行から反映されます。
#  「#」から右はメモ(説明)なので、動作には影響しません。
# =====================================================================

# ---------------------------------------------------------------------
# 1. 候補の集め方
# ---------------------------------------------------------------------
sources:
  dexscreener:
    token_profiles: true        # 新しくプロフィール登録された銘柄
    community_takeovers: true   # コミュニティ乗っ取り(CTO)された銘柄
    token_boosts: true          # ブースト(広告)が新しく付いた銘柄
    search_queries: []          # 検索ワードで探す場合に追加 例: ["pepe", "cat"]
    search_max_age_hours: 24    # 検索結果のうち、作成からこの時間以内のペアだけ使う
  trending:                     # Solana Tracker のトレンド一覧(GMGN のトレンド欄に近い)。C基準の主な探し場所
    enabled: true
    path: /tokens/trending/6h   # 期間: 5m 15m 30m 1h 2h 3h 4h 5h 6h 12h 24h
    limit: 100
    every_n_runs: 8             # (10/14) 無料枠の残りに合わせて間隔を広げた
  graduated:                    # pump.fun を卒業したばかりの銘柄一覧
    enabled: true
    path: /tokens/multi/graduated
    limit: 100
    every_n_runs: 4             # (10/14) 無料枠の残りに合わせて間隔を広げた
  trending_1h:                  # 直近1時間で勢いのある銘柄
    enabled: true 
    label: STトレンド1h
    path: /tokens/trending/1h
    limit: 100
    every_n_runs: 3             # (10/14) 無料枠の残りに合わせて間隔を広げた
    offset: 1                   # 他の一覧と同じ回に重ならないようにずらす
  trending_24h:                 # 1日を通して注目されている銘柄(数日たった銘柄も拾う)
    enabled: true 
    label: STトレンド24h
    path: /tokens/trending/24h
    limit: 100
    every_n_runs: 16             # (10/14) 無料枠の残りに合わせて間隔を広げた
    offset: 2
  trending_15m:                 # 直近15分で勢いのある銘柄(10/7〜)
    enabled: true
    label: STトレンド15m
    path: /tokens/trending/15m
    limit: 100
    every_n_runs: 3             # (10/14) 無料枠の残りに合わせて間隔を広げた
    offset: 2
  volume_6h:                    # 直近6時間の出来高(売買額)が多い銘柄
    enabled: true 
    label: ST出来高6h
    path: /tokens/volume/6h
    limit: 100
    every_n_runs: 16             # (10/14) 無料枠の残りに合わせて間隔を広げた
    offset: 3
  geckoterminal:                # (10/14) GeckoTerminal(無料・キー不要)。Solana Tracker の無料枠が尽きても候補を集められるように
    enabled: true
    trending_durations: [5m, 1h]  # トレンド一覧の期間
    trending_pages: 2             # 1ページ20件
    new_pools_pages: 3            # 新着プール(1ページ20件)
  pumpfun:
    enabled: true               # pump.fun「完成中」(卒業前)の銘柄を早めに見張り対象に入れる。卒業後にC基準で判定(10/6〜)
    min_curve: 50               # 卒業までの進み具合(%)の下限
    max_curve: 95               # 上限
    limit: 100                  # 1回で取得する最大件数(多いほど見送りの記録が増える)
    every_n_runs: 4             # (10/14) 無料枠の残りに合わせて間隔を広げた

# ---------------------------------------------------------------------
# 2. 必須条件(1つでも満たさなければ「除外」)
# ---------------------------------------------------------------------
mandatory:
  require_mint_renounced: true      # 追加発行の権限が放棄済み
  require_freeze_renounced: true    # 凍結権限が放棄済み
  reject_dangerous_extensions: true # permanent delegate / transfer hook / 送金不可 / 一時停止
  reject_rugged: true               # RugCheck で rugged 判定
  require_address_suffix: pump      # アドレスの末尾がこの文字なら通過。使わない場合は "" にする
  allowed_launchpads: [Pump.Fun, pump_fun]   # 末尾が違っても、RugCheck の発行元(launchpad)がこれなら通過
                                             # それ以外は除外(7日間は調べ直さない)
  exclude_risk_keywords:            # RugCheck の警告(名前・説明)にこの文字が含まれたら除外
    - {keyword: "creator history", label: "開発者のラグ歴(Creator history of rugged tokens)"}
    - {keyword: "fee config", label: "手数料を変更できる設定(Fee config enabled)"}

# ---------------------------------------------------------------------
# 3. 判定基準(満たさなければ「見送り」)
# ---------------------------------------------------------------------
criteria_a:                         # A:卒業済み銘柄(DEXで取引中)= C基準
  min_age_minutes: 30               # 卒業(DEX上場)から30分以上
  min_liquidity_usd: 30000         # (10/6 夜 $20K→$30K: 流動性が薄いと指値・損切りが大きく滑るため)
  max_bundle_pct: 30
  max_top10_pct: 30                 # AMMプールを除いた上位10件
  min_mcap_usd: 60000               # 時価総額 $60K〜$250K(10/5 変更: $240K超の買いが大きく負け越し)
  max_mcap_usd: 250000
  min_holders: 300
  max_insider_pct: 10               # インサイダー(開発者の仲間と思われるウォレット群)の保有率(10/6夜 5→10%を1週間試験。10/13ごろ成績で判断)
  max_dev_pct: 5                    # 開発者の保有率
  min_avg_trade_usd: 20             # 6時間の出来高÷取引数。小さいと Bot の水増しの疑い
  max_change_h6_pct: 100            # 6時間で+100%を超える急騰中は見送り(押し目待ち)

# 上位10件の計算で、流動性プールの口座を見分ける方法(RugCheck の同じレポート内で照合)
#   ① RugCheck が AMM と判定した口座  ② プール本体・プールのトークン口座  ③ 保有数がプール残高と一致
#   ④ 保有数×価格がプールのトークン側の金額と一致(①〜③で見つからないときの予備)
pool_detection:
  amount_tolerance_pct: 0.5         # ③ 残高一致とみなす誤差
  use_value_match: false            # ④ を使うか(2026-10-04: 一般の保有者をプールと誤判定するため停止)
  value_tolerance_pct: 20           # ④ 金額一致とみなす誤差(RugCheck の価格とプール残高は時点が少しずれるため広め)
  value_min_pool_usd: 1000          # ④ はこの金額以上のプールだけで判定

criteria_b:                         # B:pump.fun 卒業前
  enabled: false                    # C基準では卒業前は対象外。true にすると下の基準で判定
  min_curve_pct: 50
  max_curve_pct: 95
  min_mcap_usd: 15000
  max_mcap_usd: 60000
  min_holders: 100
  max_dev_pct: 5
  max_bundle_pct: 30

# バンドル率などが取得できなかったときの扱い
#   hold  = 見送りにする(安全寄り)
#   allow = 基準を満たしたものとして進める(通知に「不明」と表示)
on_missing_bundle: hold
bundle_metric: current              # current=現在の保有率 / initial=購入時点の保有率

# ---------------------------------------------------------------------
# 4. リスク点数(min〜max に入ったら points を加算。上から順に最初に当てはまったもの)
# ---------------------------------------------------------------------
scoring:
  bundle:
    - {min: 15, max: 30, points: 2}
  top10:
    - {min: 30, max: 40, points: 2}
    - {min: 20, max: 30, points: 1}
  insider:
    small_points: 1                 # インサイダーのウォレット群あり(小規模)
    large_points: 3                 # 大規模
    large_min_wallets: 50           # この数以上なら大規模
    large_min_pct: 5                # または保有率がこの%を超えたら大規模
  copycat:                          # 有名銘柄と同じシンボル(RugCheck の copycat 警告)
    keywords: ["copycat"]
    points: 2
  lp:                               # 卒業済み(A)のみ
    burn_threshold_pct: 90          # 焼却率がこれ以上なら「焼却済み」で 0 点
    lock_only: 1                    # 焼却なしでロックのみ(ロック率90%以上)
    partial_lock: 2                 # ロック率90%未満
    no_lock: 3                      # ロックなし
    unknown: 1                      # LP の状態が分からない(RugCheck に市場情報がない)
    partial_threshold_pct: 90
    # LP トークンがない仕組みのプールは LP 項目の対象外(0点)
    # (LP の発行元が空欄のプールも自動で対象外。pump.fun 卒業前もボンディングカーブのため対象外)
    no_lp_market_types: [meteoraDlmm, meteoraDamm2, dlmm, clmm, whirlpool, orca]
  age_minutes:
    - {min: 30, max: 60, points: 2}
    - {min: 60, max: 360, points: 1}
  pre_graduation: 2                 # pump.fun 卒業前
  liquidity_usd:
    - {min: 15000, max: 30000, points: 1}
  price_move_1h:
    abs_pct: 30                     # 直近1時間で ±30% を超えたら
    points: 2
  volume_to_liquidity:
    ratio: 20                       # 出来高が流動性の20倍以上
    window: h24                     # h24=24時間出来高 / h1=1時間出来高
    points: 2
  ads: 1                            # Dex Boost・tokenAd などの広告を購入
  ad_order_types: [tokenAd, trendingBarAd]   # orders API で広告とみなす種類
  no_socials: 1                     # 公式サイト・SNS がない
  transfer_fee:
    over_pct: 1                     # 売買税・送金手数料がこの%を超えたら
    points: 1

tiers:                              # 合計点での分類
  small_max: 2                      # 0〜2点 → 候補(リスク小)
  medium_max: 5                     # 3〜5点 → 候補(リスク中) / 6点以上 → 候補(リスク大)

# ---------------------------------------------------------------------
# 5. テーマ(銘柄名・シンボル・説明文から自動判定。点数には含めない)
#    英字は大文字小文字を区別しません。
#    「=」で始まる語は単語として一致したときだけ(例: =ai は "Snail" には反応しない)
# ---------------------------------------------------------------------
themes:
  猫: [cat, kitty, kitten, meow, neko, popcat, mew, 猫, ねこ, ネコ]
  犬: [dog, doge, shib, "=inu", puppy, "=pup", corgi, "=wif", bonk, 犬, いぬ, イヌ]
  カエル: [pepe, frog, 蛙, カエル]
  その他の動物: [penguin, pengu, monkey, "=ape", hamster, bear, "=bull", fish, duck, goat, horse, panda, rabbit, bunny, capybara, hippo, 動物]
  AI: ["=ai", "=agi", agent, "=gpt", "=llm", neural, "artificial intelligence", claude, grok, openai, chatbot]
  有名人便乗: [trump, melania, elon, musk, kanye, drake, "=cz", vitalik, saylor, "=mrbeast", "=ceo", taylor swift, obama, biden, putin]
  政治: [maga, president, election, congress, senate, 大統領]
  アニメ・ゲーム: [anime, manga, pokemon, pikachu, "=gta", minecraft, roblox, アニメ]
  食べ物: [pizza, burger, sushi, ramen, banana, cookie, taco, "=egg", 寿司]
  宇宙: [moon, mars, rocket, space, galaxy, alien, "=ufo"]
  お金・定番ミーム: [chad, wojak, "=gm", degen, "=send", "=hodl", diamond]

# ---------------------------------------------------------------------
# 5b. ナラティブ(参考・点数外)。候補を通知するときだけ調べる(すべて無料)
#     ★: 一般ニュース1件以上で+1、5件以上で+2 / 公式XとWebサイトが両方あれば+1(最大3)
#     ニュースは Googleニュース(RSS)で銘柄名を直近24時間検索。仮想通貨系の記事は別に数える
# ---------------------------------------------------------------------
narrative:
  enabled: true
  max_per_run: 10                   # 1回の実行で調べる最大件数
  cache_hours: 3                    # 同じ銘柄を調べ直すまでの時間

# ---------------------------------------------------------------------
# 5c. 🎯 勝ちパターン(急騰→急落→横ばい)の検出。条件を満たしたら別の通知を送る
#     スキャナーの記録(約15分ごと)で判定するので、ローソク足のヒゲは見えません。
#     通知が来たら GMGN の5分足で「発注前チェック」を必ず確認してください
# ---------------------------------------------------------------------
pattern:
  enabled: true
  lookback_hours: 6                 # 高値を探す期間
  drop_from_peak_pct: 40            # 高値からこの%以上下がっている
  range_window_minutes: 35          # 横ばいを判定する直近の時間幅
  min_range_minutes: 30             # (10/10 15→30) 横ばいがこの時間以上続いている(記録3回以上)
  max_h1_move_pct: 30               # (10/10) 直近1時間の値動きが±この%を超えたら「横ばい」ではない(QOAT -53%で負け)
  max_m5_move_pct: 10               # (10/10) 直近5分が±この%以上動いていたら急騰・急落の最中として通知しない
  band_pct: 10                      # 横ばいの値幅(中心から±%)
  new_low_tolerance_pct: 3          # 最新の値が、それまでの横ばいの安値をこれ以上割ったら「安値更新」
  max_m5_drop_pct: 15               # 直近5分がこの%以上の下落なら通知しない(大陰線の最中)
  min_liquidity_usd: 30000          # 流動性の下限(発注前チェック①)
  holders_drop_tolerance_pct: 3     # 保有者が高値後の最大からこの%以上減ったら「減少」
  recheck_minutes: 15               # 高値をつけた銘柄は、この間隔で記録を取る(通常は30分)
  renotify_hours: 6                 # 同じ銘柄の🎯通知の間隔
  second_range_drop_pct: 5          # 1回目の通知後、高値後の最安値がさらにこの%以上下がって再び横ばいになったら「2回目の横ばい」として再通知
  second_range_min_minutes: 30      # 2回目の通知は1回目からこの時間以上あける
  max_drop_minutes: 150             # (10/7 90→150) 高値から-40%に届くまでがこの時間より長い「階段状の下落」は対象外
  limit_above_low_pct: 10           # (10/14 5→10) 指値は高値後の最安値からこの%以上上(発注前チェック④・CFO/Taku +6〜7%で違反)
  breakout_wait: true               # (10/14) 今がそれより下なら指値は出さず「その価格を陽線で上抜けたら成行」の⏳上抜け待ちとして通知
  max_drop_from_peak_pct: 75        # 高値からこれ以上の暴落はラグの疑いとして対象外
  rug_step_drop_pct: 70             # 1回の記録(約15分)でこれ以上下がったらラグの疑い
  frozen_records: 4                 # 直近この回数の記録で値幅が frozen_band_pct 未満なら「売買がほぼない」として対象外
  frozen_band_pct: 1
  fast_watch_min_mcap_usd: 10000    # これ以上の時価総額・流動性になった銘柄は15分ごとに記録(生まれたて枠・すき間枠用)
  fast_watch_min_liquidity_usd: 4000
  peak_confirm_minutes: 30          # 一瞬だけの急騰は高値にしない: 前後この時間内に高値の85%以上の記録があるものを高値とする
  peak_confirm_ratio: 0.85


  limit_position: 0.5               # (10/10 0.25→0.5) 買う目安 = 横ばいの中ほど。下限に指値を置くと崩れた瞬間に約定する(SC・QOAT)
  sl_below_range_pct: 3             # (10/10 8→3) 損切りの目安 = 横ばいの下限のすぐ下
  tp_pct: 30                        # (10/10 40→30) 利確の目安 = 買値から +この%
  old_coin_days: 7                  # (10/10) 発行からこの日数を超えた銘柄は「古い銘柄」として通知に⚠を付ける(LEGEND 289日・ANTIRUG 648日)
  skip_old_coins: true              # (10/10) 古い銘柄の🎯は通知しない(ルール⑧: 古い銘柄の急騰は見送り)。false なら⚠付きで通知

# 📉 急落通知(10/7〜): 安全チェック済みで高値から-40〜75%下がった銘柄を知らせる。横ばいはGMGNの5分足で人が判断する
dip_alert:
  enabled: true
  renotify_hours: 6                 # 同じ銘柄は6時間に1回
  max_per_run: 10                   # 1回の実行で最大10件(RugCheckの回数を抑える)
  max_drop_pct: 55                  # (10/10) 高値からこれ以上下がったものは「買い場の目安(−40〜50%)を割り込んだ崩壊」として通知しない(ANTIRUG −67%)
  max_h1_move_pct: 30               # (10/10) 直近1時間が±この%を超えたら通知しない(ルール⑧)
  max_m5_move_pct: 15               # (10/14) 直近5分が±この%以上なら急な値動きの最中として通知しない
  skip_old_coins: true              # (10/10) 古い銘柄(old_coin_days 超)の急落は通知しない(ルール⑧)

# ---------------------------------------------------------------------
# 5d. 3つの区分(10/7〜)。🎯は区分ごとの設定で判定し、区分名を付けて通知する
#   スキャナー枠: 卒業済み・時価総額$60K〜$250K・流動性$30K以上(C基準・上の pattern 設定)
#   生まれたて枠: 卒業前、または時価総額$60K未満で発行24時間以内
#   すき間枠    : それ以外(卒業済みで流動性$30K未満・発行24時間超の小型など)
#   どの枠でも見送り: 時価総額$250K超/Pump.fun以外/流動性>時価総額でLP未ロック
# ---------------------------------------------------------------------
sections:
  newborn_max_age_hours: 24
  生まれたて枠:
    pattern:                        # 上の pattern 設定に上書き
      drop_from_peak_pct: 40        # 高値から-40〜65%(動画: 高値$10K超なら-40〜50%で買う)
      max_drop_from_peak_pct: 65
      max_drop_minutes: 60
      min_liquidity_usd: 5000           # (10/7 10K→5K) 0.05〜0.1 SOLなら自分の売買の影響は小さい。大口の売りは損切り-25%(-50%まで滑る前提)で受ける
      # (10/10) 損切り・利確は上の基本設定(横ばいの下限の3%下・+30%)にそろえた。旧: 指値から-25%・2倍/3倍
      # 金額は sizing で決める(10/12〜)
      note: "⚠️ 生まれたて枠: 流動性が薄く、損切りは目安より滑る前提。GMGNの保有者タブでフィッシング・バンドル20%以下も確認\n"
    safety:
      max_top10_pct: 40             # プールを除く上位10件
      max_single_holder_pct: 10     # プールを除く1人
      max_insider_pct: 10
      max_bundle_pct: 20
      max_dev_pct: 5
      min_holders: 100
  すき間枠:
    pattern:
      max_drop_minutes: 150
      min_liquidity_usd: 5000           # (10/7 10K→5K) 0.05〜0.1 SOLなら自分の売買の影響は小さい。大口の売りは損切り-25%(-50%まで滑る前提)で受ける
      # (10/10) 損切り・利確は上の基本設定(横ばいの下限の3%下・+30%)にそろえた。旧: 指値から-25%・1.5倍/2倍
      note: "⚠️ すき間枠: 流動性が薄く、損切りは目安より滑る前提。GMGNの保有者タブでフィッシング・バンドル20%以下も確認\n"
    safety:
      max_top10_pct: 40
      max_single_holder_pct: 10
      max_insider_pct: 10
      max_bundle_pct: 20
      max_dev_pct: 5
      min_holders: 150

# ---------------------------------------------------------------------
# 5f. 🚀 若いモメンタム枠(10/14〜)。上がっている若い銘柄に乗り、1時間以内に出る(順張り)
#     根拠: 10/6〜10/10 の紙トレードで、発行1時間以内は勝率68%・平均+13%、1時間+30%以上は勝率61%・平均+10%
# ---------------------------------------------------------------------
momentum_tier:
  enabled: true
  notify: false                     # (10/14深夜) 通知を止めて記録だけ(当日4件すべてラグ・過去10日の検証でも全期間マイナス)
  min_age_minutes: 10               # 発行直後の大混乱(PvP)は避ける
  max_age_minutes: 120              # 発行から2時間以内
  min_h1_pct: 30                    # 直近1時間で+30%以上
  max_h1_pct: 100                   # (10/14夜) 1時間+100%超は高値づかみとして通知しない(過去の通知で1時間後の中央値-10〜-20%)
  max_m5_pct: 15                    # (10/14夜 30→15) 直近5分が+15%超なら飛びつかない(+15〜30%は1時間後の中央値-12%)
  legacy_max_m5_pct: 30             # 比較用「🚀旧」(旧条件)の5分の上限
  record_legacy: true               # 旧条件なら通知していた銘柄を、通知せず仮想売買だけ記録して成績を比べる
  max_m5_drop_pct: 15               # 直近5分が-15%以下(急落中)なら見送り
  min_liquidity_usd: 30000
  min_mcap_usd: 20000
  max_mcap_usd: 250000
  max_top10_pct: 40
  max_dev_pct: 5
  max_bundle_pct: 20
  stop_loss_pct: -20                # 0.05 SOLで損失約0.01 SOL
  take_profit_pct: 50               # ここで半分利確 → 残りは損切りを建値へ
  time_exit_minutes: 60
  size_sol: 0.05
  renotify_hours: 6
  max_per_run: 3
  max_checks_per_run: 8             # RugCheck で確認する最大件数

# ---------------------------------------------------------------------
# 5g. 🌱 初動枠(10/14夜〜)。値段がまだ動き出す前に、出来高・買い・保有者が先に増えた銘柄
#     根拠: 過去の通知で1時間+0〜100%・5分+0〜15%が1時間後の中央値・勝率とも最良
# ---------------------------------------------------------------------
sprout_tier:
  enabled: true
  min_age_minutes: 10
  max_age_minutes: 360              # 発行から6時間以内
  min_h1_pct: -10                   # 1時間で-10%より下げていない
  max_h1_pct: 100                   # 1時間+100%超は上がりすぎ
  min_m5_pct: 0                     # 直近5分は0〜+15%(まだ跳ねていない)
  max_m5_pct: 15
  min_vol_ratio: 2.0                # 5分の出来高が、1時間の5分平均の2倍以上
  min_buy_sell_ratio: 1.3           # 1時間の買い件数が売り件数の1.3倍以上
  holders_window_minutes: 50        # この間に記録した保有者数が減っていたら見送り(記録がなければ「未確認」で通知)
  min_liquidity_usd: 20000
  min_mcap_usd: 20000
  max_mcap_usd: 250000
  max_top10_pct: 40
  max_dev_pct: 5
  max_bundle_pct: 20
  stop_loss_pct: -20
  take_profit_pct: 50               # ここで半分利確 → 残りは損切りを建値へ
  time_exit_minutes: 60
  renotify_hours: 6
  max_per_run: 3
  max_checks_per_run: 8

# ---------------------------------------------------------------------
# 5h. 🐣 生まれたて枠(10/14夜〜・記録のみ。Slack通知なし)。発行直後の小さい銘柄が勝てるかを紙トレードで検証
#     1週間の成績を21時のまとめで見て、通知するか決める
# ---------------------------------------------------------------------
hatch_tier:
  enabled: true
  min_age_minutes: 10
  max_age_minutes: 60
  min_h1_pct: 30
  max_h1_pct: 100
  max_m5_pct: 15
  max_m5_drop_pct: 15
  min_liquidity_usd: 5000
  min_mcap_usd: 5000
  max_mcap_usd: 100000
  max_top10_pct: 40
  max_dev_pct: 5
  max_bundle_pct: 20
  max_checks_per_run: 6             # RugCheck で確認する最大件数

# 🐣早: 発行1〜10分の比較用(記録のみ)。10〜60分の🐣と成績を比べ、良ければ🚀の下限を下げる
hatch_early_tier:
  enabled: true
  min_age_minutes: 1
  max_age_minutes: 10
  min_h1_pct: 30
  max_h1_pct: 100000                # 発行直後は「1時間」=発行からの上昇なので上限なし
  max_m5_pct: 1000
  max_m5_drop_pct: 15
  min_liquidity_usd: 5000
  min_mcap_usd: 5000
  max_mcap_usd: 100000
  max_top10_pct: 40
  max_dev_pct: 5
  max_bundle_pct: 20
  max_checks_per_run: 6

# ---------------------------------------------------------------------
# 5e. 🧭 ナラティブ枠(10/10〜)。銘柄を選ぶのは本人。スキャナーは「最低限の安全」と規模だけで絞り、
#     チャートの形では見送らない(形はタイミングの助言として通知に書く)
# ---------------------------------------------------------------------
narrative_tier:
  enabled: true
  max_per_run: 5                    # 1回の実行で通知する最大件数
  max_checks_per_run: 10            # RugCheck で確認する最大件数(1時間の出来高が多い順)
  renotify_hours: 6                 # 同じ銘柄は6時間に1回
  # 安全の最低ライン(ここだけはスキャナーが止める)。🚨・権限・ラグの段差も確認
  max_dev_pct: 5
  max_bundle_pct: 20
  max_top10_pct: 40
  rug_step_drop_pct: 70             # 1回の記録で-70%以上の暴落があったら対象外
  # 規模
  min_holders: 100
  min_liquidity_usd: 5000
  min_mcap_usd: 10000
  max_mcap_usd: 1000000
  max_age_hours: 72                 # 新しい話題に絞る(発行から3日以内)
  min_vol_h1_usd: 5000              # 直近1時間の出来高。売買がほぼ止まっている銘柄は出さない
  # 金額は sizing で決める(10/12〜 ナラティブ枠0.05・流動性$20K未満は0.02)

# ---------------------------------------------------------------------
# 5e2. 🔗 ベータプレイ(10/12〜 動画: 本命が走ったら同じテーマの2番手を探す)
#     ナラティブ枠の通知に「本命」と「共通点」を付け、優先して確認する
# ---------------------------------------------------------------------
beta_play:
  enabled: true
  leader_min_mcap_usd: 1000000      # 本命: 時価総額$1M以上
  leader_max_age_hours: 48          # 本命: 発行から2日以内
  leader_min_h1_pct: 0              # 本命: 直近1時間がプラス(まだ上昇中)
  leader_keep_hours: 6              # 本命を覚えておく時間
  max_beta_mcap_ratio: 0.3          # 候補は本命の時価総額の30%以下
  ignore_themes: [お金・定番ミーム]   # 広すぎるテーマは共通点に数えない
  size_sol: 0.02                    # 例外で入るときの上限

# ---------------------------------------------------------------------
# 5f. 📚 今日の勉強リスト(10/11〜)。1日のまとめと一緒に送る
#     動画「卒業した強いナラティブ5つと、ゼロになった悪い銘柄5つを毎日調べる」用
# ---------------------------------------------------------------------
daily_study:
  enabled: true
  count: 5
  strong_min_peak_usd: 100000       # 強い: 卒業済みで最高時価総額がこれ以上
  strong_min_keep: 0.4              #       かつ今も最高値のこの割合以上を保っている
  weak_min_peak_usd: 20000          # 弱い: 最高時価総額がこれ以上まで上がったのに
  weak_max_keep: 0.15               #       今は最高値のこの割合以下(−85%以上)
  max_age_hours: 48                 # 発行からこの時間以内の銘柄だけ(古い大型銘柄を除く)
  max_peak_usd: 50000000            # これを超える最高値は価格の取り違えとして除く

# ---------------------------------------------------------------------
# 6. 通知
# ---------------------------------------------------------------------
notify:
  renotify_hours: 24                # 同じ銘柄はこの時間内は再通知しない(段階が変わったら再通知)
  daily_summary_hour_jst: 21        # 見送り・成績のまとめを送る時刻(日本時間 0〜23)
  notify_tiers: [小, 中, 大]         # 通知する段階。例: 大を通知しないなら [小, 中]
  heartbeat_minutes: 60            # (10/14夜) この時間通知がなければ「💤 稼働中」と理由を1行で送る。0で止める
  ca_message: true                  # (10/10) 各通知のあとに CA だけのメッセージを送る(長押しでコピーしやすい)。false で止める

# ---------------------------------------------------------------------
# 7. 仮想売買(ペーパートレード)。実際の売買は一切しません
#    候補を通知した時点で amount_usd 分を買ったことにして、下のルールで損益を計算
# ---------------------------------------------------------------------
paper_trading:
  enabled: true
  amount_sol: 0.05                 # 1回の仮想購入額(SOL)。実際の取引と同じ金額(10/6 20:22〜 0.05未満には下げない)
  amount_usd: 20                   # SOL 価格が取れないときの予備
  stop_loss_pct: -40               # 購入価格からこの%まで下がったら残りを全部売る
  take_profit:                     # 上から順に判定
    - {pct: 50, sell_ratio: 0.5}   # +50% で最初の数量の半分を売る
    - {pct: 100, sell_ratio: 1.0}  # +100% で残りを全部売る
  time_exit_minutes: 60            # 購入からこの時間がたったら残りを全部売る
  max_price_jump_x: 20             # (10/10) 1回の確認で前回価格のこの倍数を超えて上がったら価格の取り違えとして無視(QI +2,277,712%)
  fee_pct: 1.0                     # 1回の売買ごとの手数料・スリッページ(価格のずれ)の見込み。0 にすると無視
  tiers: [小, 中, 大]              # 仮想売買の対象にする段階
  tier_rules:                      # (10/14) 段階ごとのルール(上の基本設定に上書き)。🎯は通知の指値/上抜けが約定したときだけ買う(期限1時間)
    "🚀": {stop_loss_pct: -20, take_profit: [{pct: 50, sell_ratio: 0.5}], breakeven_after_tp: true, time_exit_minutes: 60}
    "🚀旧": {stop_loss_pct: -20, take_profit: [{pct: 50, sell_ratio: 0.5}], breakeven_after_tp: true, time_exit_minutes: 60}   # (10/14夜) 比較用・通知なし
    "🐣早": {stop_loss_pct: -25, take_profit: [{pct: 50, sell_ratio: 0.5}], breakeven_after_tp: true, time_exit_minutes: 30, amount_sol: 0.02}   # (10/14夜) 記録のみ・発行1〜10分
    "🐣": {stop_loss_pct: -25, take_profit: [{pct: 50, sell_ratio: 0.5}], breakeven_after_tp: true, time_exit_minutes: 30, amount_sol: 0.02}   # (10/14夜) 記録のみ
    "🌱": {stop_loss_pct: -20, take_profit: [{pct: 50, sell_ratio: 0.5}], breakeven_after_tp: true, time_exit_minutes: 60}
    "🎯": {stop_loss_pct: -12, take_profit: [{pct: 30, sell_ratio: 1.0}], time_exit_minutes: 360}
    "🎯生": {stop_loss_pct: -12, take_profit: [{pct: 30, sell_ratio: 1.0}], time_exit_minutes: 360}
    "🎯隙": {stop_loss_pct: -12, take_profit: [{pct: 30, sell_ratio: 1.0}], time_exit_minutes: 360}
    "📉": {stop_loss_pct: -12, take_profit: [{pct: 30, sell_ratio: 1.0}], time_exit_minutes: 360}
  max_entries_per_day:             # 1日(日本時間 0時〜24時)の仮想購入の上限回数
    weekday: 99                    # 月〜金(10/6〜 回数上限なし)
    weekend: 99                    # 土・日(10/6〜 回数上限なし)
  daily_loss_limit_sol: 99         # (10/6夜〜 損失上限なし・連敗終了なし。発注前チェックで絞る)

# ---------------------------------------------------------------------
# 8. 動作・API 回数の上限
# ---------------------------------------------------------------------
runtime:
  max_runtime_sec: 300              # 1回の実行で使う最大時間(GitHub の無料枠節約)
  rugcheck_max_per_run: 40          # RugCheck を1回で新しく調べる最大件数
  rugcheck_skip_below_liquidity: true  # 流動性が criteria_a の基準未満なら RugCheck を省略して見送り
                                       # (pump.fun 卒業前は対象外。false にすると全銘柄を RugCheck)
  rugcheck_interval_sec: 0.6        # RugCheck への連続アクセスの間隔
  rugcheck_fresh_minutes: 60        # 候補として通知する前に、これより古い RugCheck 結果は取り直す
  st_cache_minutes: 60              # Solana Tracker の結果を使い回す時間(無料枠が厳しいときは 180 など)
  recheck_minutes: 30               # 見送り・候補の銘柄を再チェックする間隔
  young_recheck_hours: 2            # (10/14夜) 発行からこの時間以内の銘柄は毎回(15分ごと)見直す(🚀の取り逃がし対策)
  excluded_recheck_hours: 6         # 除外銘柄を再チェックするまでの時間
  watch_hours: 24                   # 見つけた銘柄を追いかける時間
  max_watch: 1000                   # 追いかける銘柄の上限数(10/7 400→1000: 400だと約3〜6時間で追跡が切れていた)

solana_tracker:
  max_calls_per_run: 4            # (10/14) 1回の実行で使う上限。10/1〜10日で4,400回使い切りかけたため
  monthly_budget: 9000              # 1か月に使ってよいリクエスト数(無料プランの上限より少し少なめに)
  daily_pacing: true                # 月の上限を日割りして、月初に使い切らないようにする

# ---------------------------------------------------------------------
# 金額ルール(10/12〜)。通知の「目安」「金額」に表示
#   流動性$20K未満 → 0.02 / ナラティブ枠 → 0.05 / 普通の枠 → 0.05
#   普通の枠で流動性$30K以上かつ発注前チェックが全部⚪ → 0.1
# ---------------------------------------------------------------------
sizing:
  thin_liquidity_usd: 20000
  thin_sol: 0.02
  narrative_sol: 0.05
  base_sol: 0.05
  a_liquidity_usd: 30000
  a_sol: 0.1
