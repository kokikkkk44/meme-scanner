name: wallet-history

on:
  workflow_dispatch:
    inputs:
      cap:
        description: "1ウォレットあたりの取引上限"
        required: true
        default: "250"
      since:
        description: "開始日(YYYY-MM-DD)"
        required: true
        default: "2026-10-01"
      minutes:
        description: "最大実行時間(分)"
        required: true
        default: "300"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect
        env:
          MAX_MINUTES: ${{ inputs.minutes }}
        run: python wallet_hist.py "${{ inputs.cap }}" "${{ inputs.since }}"
      - name: Save
        if: always()
        run: |
          git config user.name "meme-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/copy_bt/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: wallet history $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
