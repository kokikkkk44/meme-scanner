name: wallet-check

on:
  workflow_dispatch:
    inputs:
      wallets:
        description: "ラベル:ウォレット をカンマ区切りで"
        required: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check
        env:
          SOLANATRACKER_API_KEY: ${{ secrets.SOLANATRACKER_API_KEY }}
        run: python wallet_check.py "${{ inputs.wallets }}"
      - name: Save
        run: |
          git config user.name "meme-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallet_check/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: wallet check $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
