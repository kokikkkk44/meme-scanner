name: meme-scanner

on:
  # 定期実行は cron-job.org から15分おきに workflow_dispatch で起動(GitHub の schedule は遅延・抜けが多いため停止)
  # cron-job.org が止まったときの予備に戻す場合は、下の2行の # を外す
  # schedule:
  #   - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal=通常 / dry_run=Slackに送らず保存もしない / test_slack=テスト通知を1通送る"
        type: choice
        default: normal
        options: [normal, dry_run, test_slack]

permissions:
  contents: write   # data フォルダの記録を保存するため

concurrency:
  group: meme-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # (10/19) 実行回数を半分に(15分ごと→30分ごと)。cron-job.org は15分ごとのまま、
      # 毎時 :00前後 と :30前後 の起動だけ実行し、:15前後 と :45前後 は何もせず終わる。
      # 手動で起動したとき(mode を変えたとき)は常に実行。元に戻すときはこのステップを消す
      - name: Half-rate gate
        id: gate
        run: |
          m=$(date -u +%-M)
          if [ "${{ inputs.mode }}" != "normal" ] || [ $(( ((m + 5) / 15) % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "30分ごとに間引き中のため今回は実行しません(${m}分)"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Track traded tokens (銘柄探しは10/20で停止)
        if: steps.gate.outputs.run == 'true'
        env:
          DRY_RUN: ${{ inputs.mode == 'dry_run' }}
        run: python tracker.py

      - name: Save records
        if: ${{ steps.gate.outputs.run == 'true' && inputs.mode != 'dry_run' && inputs.mode != 'test_slack' }}
        run: |
          git config user.name "meme-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "data: scan $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
