name: wallet-hunt

on:
  workflow_dispatch:
    inputs:
      tokens:
        description: "ラベル:アドレス をカンマ区切りで"
        required: true

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Hunt
        env:
          SOLANATRACKER_API_KEY: ${{ secrets.SOLANATRACKER_API_KEY }}
        run: python wallet_hunt.py "${{ inputs.tokens }}"
      - name: Save
        run: |
          git config user.name "meme-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wallet_hunt/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: wallet hunt $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
