name: copy-backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fb(早く買った人) / chart(1分足)"
        required: true
        default: "fb"
      cap:
        description: "今回使う Solana Tracker の回数上限"
        required: true
        default: "320"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect
        env:
          SOLANATRACKER_API_KEY: ${{ secrets.SOLANATRACKER_API_KEY }}
        run: python copy_bt.py "${{ inputs.mode }}" "${{ inputs.cap }}"
      - name: Save
        run: |
          git config user.name "meme-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/copy_bt/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: copy backtest ${{ inputs.mode }} $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
